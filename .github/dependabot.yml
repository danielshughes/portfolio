version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      # 1.65.x Firefox crashes the page during axe scans (2026-11-26).
      # Remove once a later release passes tests/visual/portfolio.spec.ts,
      # and move the package.json playwright-core override with it.
      - dependency-name: "@playwright/test"
        versions: ["1.65.x"]
    groups:
      cloudflare:
        patterns: ["cf", "@cloudflare/config", "wrangler", "miniflare"]
        update-types: ["minor", "patch"]
      npm:
        patterns: ["*"]
        exclude-patterns: ["cf", "@cloudflare/config", "wrangler", "miniflare"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
