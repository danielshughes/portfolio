name: Quality
on:
  pull_request:
  push:
    branches:
      - develop
      - main
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range_start="$BASE_SHA"
            range_end="$HEAD_SHA"
          else
            range_start="$BEFORE_SHA"
            range_end="$CURRENT_SHA"
          fi

          if [[ -z "$range_start" || "$range_start" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$range_end")"
          else
            changed_files="$(git diff --name-only "$range_start" "$range_end")"
          fi

          code=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|.prettierrc.json|astro.config.mjs|eslint.config.mjs|package-lock.json|package.json|playwright.config.ts|public/*|scripts/*|src/*|tests/*|worker/*|wrangler.jsonc)
                code=true
                break
                ;;
            esac
          done <<< "$changed_files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
  quality:
    if: needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint:workflows
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run quality
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/portfolio-test-results
      - run: npm audit --audit-level=low
      - name: Redacted secret scan of history and deliverables
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --redact=100 --log-opts="--all" .
          for path in src worker tests scripts dist .github package.json package-lock.json astro.config.mjs playwright.config.ts eslint.config.mjs wrangler.jsonc README.md AGENTS.md; do
            "$scanner_dir/gitleaks" dir --redact=100 "$path"
          done
  deploy-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'danielshughes/portfolio' && needs.changes.outputs.code == 'true'
    needs:
      - changes
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
      url: https://dev.dlhs.co.uk
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: false
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:dev
      - name: Deploy the checked development commit
        run: node scripts/deploy-development.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RADAR_API_TOKEN: ${{ secrets.RADAR_API_TOKEN }}
